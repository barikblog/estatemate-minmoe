services:
  - type: web
    name: estatemate-access-bridge
    runtime: node
    plan: free
    rootDir: bridge
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ESTATEMATE_WORKER_URL
        value: https://estatemate.estatemate.workers.dev
