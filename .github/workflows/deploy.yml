name: Deploy EstateMate

# ONE ship path at a time, chosen by the repository variable
# CLOUDFLARE_BUILDS_AUTHORITATIVE (Settings > Secrets and variables > Actions >
# Variables):
#
#   unset / anything but "true"  -> this workflow deploys (the historical path)
#   "true"                       -> Cloudflare Workers Builds deploys, and this
#                                   workflow applies no migrations and ships
#                                   nothing, so two runners can never race on
#                                   D1 or publish different bundles.
#
# The variable exists so the cutover is a single reversible flip rather than a
# commit that deletes the working deploy path before the dashboard side is
# verified. See docs/CLOUDFLARE-WORKERS-BUILDS.md for the dashboard settings and
# the cutover order.
#
# The workflow keeps its name: .github/workflows/smoke.yml triggers on
# `workflow_run: [Deploy EstateMate]`, and renaming it would silently stop the
# post-deploy smoke test.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estatemate-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CLOUDFLARE_BUILDS_AUTHORITATIVE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure private-storage encryption secret
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler secret list | grep -q 'STORAGE_ENCRYPTION_KEY'; then
            openssl rand -base64 48 | npx wrangler secret put STORAGE_ENCRYPTION_KEY
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply estatemate-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and web assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Runs only in the delegated mode, so the Actions run still says plainly what
  # happened instead of looking like a deploy that quietly did nothing.
  delegated-to-cloudflare-builds:
    if: vars.CLOUDFLARE_BUILDS_AUTHORITATIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report the delegation
        run: |
          echo "::notice::CLOUDFLARE_BUILDS_AUTHORITATIVE=true — Cloudflare Workers Builds is the ship path for commit $GITHUB_SHA. This workflow deliberately built nothing, applied no D1 migrations and deployed nothing. Read the 'Workers Builds: estatemate' check on this commit for the build log."
          echo "::notice::Rollback: delete the CLOUDFLARE_BUILDS_AUTHORITATIVE repository variable and re-run this workflow to ship from GitHub Actions again."
